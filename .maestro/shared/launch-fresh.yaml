appId: com.bkomen.solararraysimulator
---
# Shared: Launch with clear state and connect the Expo Dev Client to local Metro
# iOS sim: 127.0.0.1:8081 (shares the Mac loopback). Android AVD: 10.0.2.2:8081.
# Ends on the Welcome screen with "Solar Array Simulator" visible

- runFlow:
    when:
      platform: iOS
    file: launch-fresh.ios.yaml
- runFlow:
    when:
      platform: Android
    file: launch-fresh.android.yaml
