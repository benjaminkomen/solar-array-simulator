appId: com.bkomen.solararraysimulator
env:
  # AVD host loopback. Override both for a physical device or adb reverse:
  #   maestro test -e METRO_URL=http%3A%2F%2F127.0.0.1%3A8081 -e METRO_URL_PLAIN=http://127.0.0.1:8081 …
  METRO_URL: http%3A%2F%2F10.0.2.2%3A8081
  METRO_URL_PLAIN: http://10.0.2.2:8081
---
# Android emulator: Launch with clear state, connect Dev Client to Metro.
# 10.0.2.2 is the AVD alias for the host (127.0.0.1 inside the emulator is the guest).
# Maestro openLink uses ACTION_VIEW — same intent as:
#   adb shell am start -a android.intent.action.VIEW -d "<this URL>"
# Ends on Welcome with "Solar Array Simulator" visible
#
# After Metro attaches, SDK 57 shows either the first-run Continue sheet or the
# full Dev Menu (Reload / Go home / Close) over Welcome. Dev Menu is already
# attached — turn off the Tools overlay (Dev Menu "Tools button" toggle once),
# then dismiss (Close or 50%,15%). Do not wait 90s for Continue, and do not tap
# Go home (that returns to the launcher). The Tools overlay steals the
# Production header overflow hit target if left on.

- launchApp:
    clearState: true
# Home chrome is up only after the launcher Compose tree is ready.
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- openLink: solararraysimulator://expo-development-client/?url=${METRO_URL}&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 15000
# Deep-link may leave us on Home. Recently Opened / packager cards show the plain URL.
- runFlow:
    when:
      visible: ${METRO_URL_PLAIN}
    commands:
      - tapOn: ${METRO_URL_PLAIN}
# Connect is disabled while the URL field is empty — type, then submit.
# Skip if the URL is already on screen (we just tapped Recently Opened).
- runFlow:
    when:
      visible: "Connect"
      notVisible: ${METRO_URL_PLAIN}
    commands:
      - tapOn: "exp://"
      - inputText: ${METRO_URL_PLAIN}
      - hideKeyboard
      - tapOn: "Connect"
# One-shot: if Dev Menu is already up, flip Tools off before dismiss.
# Do not put this inside the poll — a second tap would turn the overlay back on.
- runFlow: hide-android-dev-client-tools.yaml
# Poll for Welcome. Each pass: dismiss Dev Menu, or tap Continue, then peek.
- repeat:
    times: 18
    while:
      notVisible: "Solar Array Simulator"
    commands:
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - tapOn:
                point: "50%,15%"
      - runFlow:
          when:
            visible: "Reload"
            notVisible: "Continue"
          commands:
            - tapOn:
                point: "50%,15%"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Solar Array Simulator"
          timeout: 5000
          optional: true
- extendedWaitUntil:
    visible: "Solar Array Simulator"
    timeout: 120000
# Menu still up (dismiss missed) or FAB still showing after Welcome: open
# the Tools FAB if needed, wait for the Tools button row, flip once, dismiss.
# Retry only while the FAB is still visible and the menu is not already
# open — a second tap on Tools button would turn the overlay back on.
- runFlow: hide-android-dev-client-tools.yaml
- runFlow:
    when:
      visible: "Tools"
      notVisible: "Tools button"
    file: hide-android-dev-client-tools.yaml
