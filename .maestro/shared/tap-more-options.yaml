appId: com.bkomen.solararraysimulator
---
# Production overflow menu.
# iOS: accessibilityLabel "More options" (right toolbar — works in iOS Dev Client).
# Android: in-content "Configuration options" on the output card. Do not tap the
# header-right overflow — that is Expo Dev Client Tools (Reload / Go home).

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "More options"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Configuration options"
