appId: com.bkomen.solararraysimulator
---
# Production overflow menu.
# iOS: accessibilityLabel "More options"
# Android: "Configuration options" — must not share the Dev Client AppBar
# overflow contentDescription ("More options" → Reload / Go home / Tools).

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "More options"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Configuration options"
