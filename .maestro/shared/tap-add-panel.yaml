appId: com.bkomen.solararraysimulator
---
# Custom canvas: add a panel (iOS SF Symbol "add", Android Toolbar.Button "Add panel").
# One tap. A missed handler is an app bug, not a flow flake.

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "add"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Add panel"
