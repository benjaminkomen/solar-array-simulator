appId: com.bkomen.solararraysimulator
---
# Turn off Expo Dev Client's Tools FAB so it cannot sit on Custom's trailing
# Finish (bottom-right) or the Production header ⋮.
# The Dev Menu row label is "Tools button"; after clearState the toggle is ON.
# Tapping the row flips it off. Tools button is a toggle — tap it once per
# open menu, then dismiss so a later hide call cannot flip it back on.
#
# After launch-fresh the FAB label "Tools" is still the Icon
# contentDescription even after the caption hides (10s). Opening the menu
# and immediately looking for "Tools button" races the sheet: the row is
# often not in the tree yet, hide no-ops, FAB stays. Wait for the row.

- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn: "Tools button"
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - tapOn:
                point: "50%,15%"
      - runFlow:
          when:
            visible: "Reload"
            notVisible: "Continue"
          commands:
            - tapOn:
                point: "50%,15%"

- runFlow:
    when:
      visible: "Tools"
      notVisible: "Tools button"
    commands:
      - tapOn: "Tools"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: "Tools button"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: "Tools button"
          commands:
            - tapOn: "Tools button"
            - waitForAnimationToEnd:
                timeout: 5000
            - runFlow:
                when:
                  visible: "Close"
                commands:
                  - tapOn: "Close"
            - runFlow:
                when:
                  visible: "Go home"
                commands:
                  - tapOn:
                      point: "50%,15%"
            - runFlow:
                when:
                  visible: "Reload"
                  notVisible: "Continue"
                commands:
                  - tapOn:
                      point: "50%,15%"
