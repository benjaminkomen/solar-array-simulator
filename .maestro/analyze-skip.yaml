appId: com.bkomen.solararraysimulator
---
# Analyze Screen: Verify model picker UI and Skip action
# iOS: Upload → gallery pick → Analyze (universal Picker) → change model → Skip → Custom
# Android: empty AVD gallery — Upload "Continue without photo" empty-state → same picker/toolbar

- runFlow: shared/launch-fresh.yaml

# Navigate wizard to Upload screen
- tapOn:
    id: "get-started-button"
- extendedWaitUntil:
    visible: "Panel Settings"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Take or Select Photo"
    timeout: 10000

# iOS: real Photos library pick
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "choose-gallery-button"
      - extendedWaitUntil:
          visible: "Photos"
          timeout: 10000
      - tapOn:
          point: "17%,25%"

# Android: do not open the system picker (empty emulator gallery blocks Analyze)
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "analyze-empty-state-button"

# Verify we land on the Analyze screen with model picker
- runFlow: shared/wait-analyze-header.yaml

- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "No photo selected"

# Selected value is visible before the menu opens
- assertVisible: "Claude Sonnet 4.6 (Default)"

# Open the menu and change selection (not an always-visible radio list)
- tapOn: "Claude Sonnet 4.6 (Default)"
- assertVisible: "Claude Opus 4.6"
- assertVisible: "Amazon Nova Pro"
- tapOn: "Claude Opus 4.6"

# Skip to Custom screen instead of analyzing
- tapOn: "Skip"
- extendedWaitUntil:
    visible:
        id: "canvas-container"
    timeout: 10000
