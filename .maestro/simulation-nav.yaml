appId: com.bkomen.solararraysimulator
---
# Simulation Screen: Navigate from Production and verify loading

# Run through wizard to reach Production
- runFlow: shared/launch-fresh.yaml
- runFlow: shared/wizard-to-production.yaml

# Tap simulation button in header (iOS / Android "Simulate")
- runFlow: shared/tap-simulate.yaml

# Verify Simulation screen loads
- extendedWaitUntil:
    visible: "Simulation"
    timeout: 15000

# Verify simulation UI elements
- assertVisible: "Total Output"
- assertVisible: "Spring"
- assertVisible: "Summer"
- assertVisible: "Fall"
- assertVisible: "Winter"

# Android AVD WebGPU: chrome (Simulation / seasons / Total Output) is immediate;
# the canvas stays black for tens of seconds while Dawn paints. That is not
# "WebGPU unavailable". waitForAnimationToEnd returns immediately on a static
# black canvas — do not use it as the 3D settle. Optional wait is a timed
# settle until a paint testID exists.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "webgpu-scene-painted"
          timeout: 90000
          optional: true
- takeScreenshot: sim-3d-proof
