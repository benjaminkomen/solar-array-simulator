appId: com.bkomen.solararraysimulator
---
# Simulation Screen: Navigate from Production and verify loading

# Run through wizard to reach Production
- runFlow: shared/launch-fresh.yaml
- runFlow: shared/wizard-to-production.yaml

# Tap simulation button in header (iOS / Android "Simulate")
- runFlow: shared/tap-simulate.yaml

# Verify Simulation screen loads
- extendedWaitUntil:
    visible: "Simulation"
    timeout: 15000

# Verify simulation UI elements. Season labels are segmented chrome again.
- assertVisible: "Total Output"
- assertVisible: "Spring"
- assertVisible: "Summer"
- assertVisible: "Fall"
- assertVisible: "Winter"

# Short settle only. Do not wait for a testID that is not in the tree —
# a 90s optional wait lets the app leave Simulation (AVD launcher).
# Proof must be taken while Simulation chrome is still in the foreground.
# Required visual: panel + sun (empty arrays are seeded in JS).
# Black first frame = GPU settle. Never the launcher.
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Simulation"
- assertVisible: "Total Output"
- takeScreenshot: sim-3d-proof
